# The full stack for local development: Postgres (threads, runs, traces)
# + Redis (BullMQ job queues). These are dev-only credentials.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sailor
      POSTGRES_PASSWORD: sailor
      POSTGRES_DB: sailor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailor"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
