# The full stack for local development: Postgres (threads, runs, traces)
# + Redis (BullMQ job queues). Production injects credentials as environment
# variables from the platform secret store — these are dev-only values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sailor
      POSTGRES_PASSWORD: sailor
      POSTGRES_DB: sailor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailor"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Local emulation of AWS Secrets Manager, so the production adapter can be
  # exercised without an AWS account: same SDK, endpoint overridden to :4566.
  # Seed it with `npm run secrets:local`. Not used unless
  # SAILOR_SECRETS_BACKEND=aws.
  localstack:
    image: localstack/localstack:stable
    environment:
      SERVICES: secretsmanager
      DEBUG: "0"
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  localstack:
